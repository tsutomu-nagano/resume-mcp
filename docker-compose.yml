services:
  app:
    build: .
    container_name: resume-mcp
    env_file:
      - path: .env.app
        required: false
    ports:
      - "${MCP_PORT:-8000}:8000"
    restart: unless-stopped

  tunnel-client:
    build:
      context: .
      dockerfile: Dockerfile.tunnel-client
    container_name: resume-mcp-tunnel-client
    env_file:
      - path: .env.tunnel
        required: false
    volumes:
      - ${HOME}/.local/bin/tunnel-client:/usr/local/bin/tunnel-client:ro
      - ${HOME}/.config/tunnel-client:/home/tunnel-client/.config/tunnel-client:ro
    command:
      - sh
      - -c
      - |
        tunnel-client init --profile resume --tunnel-id "$${CONTROL_PLANE_TUNNEL_ID}" --mcp-server-url http://app:8000/mcp
        tunnel-client run --profile resume

    depends_on:
      - app
    ports:
      - "${TUNNEL_CLIENT_HEALTH_PORT:-8080}:8080"
    restart: unless-stopped
